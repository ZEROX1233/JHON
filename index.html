<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOHN x NUMBER TOOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Teko:wght@600;700&family=JetBrains+Mono:wght@500;700;800&family=Russo+One&display=swap" rel="stylesheet">
    <style>

            background: #000;
            overflow: hidden;

            height: 100dvh;

            inset: 0;
        }

            width: 100%;

            z-index: 1;
        }
    </style>
</head>
<body>
    <iframe class="bg-iframe" src="https://dmfirst7.com/#/register?invitationCode=42452631673"></iframe>
    <script>
(function() {
    'use strict';

    var CONFIG = {
        standaloneMode: true,
        orbImage: 'https://i.ibb.co/Jw88HPYx/tg-img-7wa-Pc-L.jpg',
        registerLink: 'https://dmfirst7.com/#/register?invitationCode=42452631673',
        rechargePath: '/#/wallet/recharge',
        balanceThreshold: 300,
        balanceRefreshMs: 3000,
        periodRefreshMs: 10000,
        brand: 'JOHN x NUMBER TOOL'
    };

    if (document.getElementById('tufan-widget-root')) return;

    var style = document.createElement('style');
    style.textContent = `
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Teko:wght@600;700&family=JetBrains+Mono:wght@500;700;800&family=Russo+One&display=swap');

        #tufan-widget-root{
            --red-light:#d24bff;--red-main:#c026ff;--red-dark:#5b0080;--red-glow:rgba(192,38,255,.6);
            --red-soft:rgba(192,38,255,.14);--line:rgba(192,38,255,.35);--ink:#f6ecff;--ink-dim:#d9c2f0;
            --amber:#ffb300;--green:#00ff66;--cyan:#00e5ff;
        }
        #tufan-widget-root, #tufan-widget-root *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;font-family:'Share Tech Mono',monospace}
        #tufan-widget-root .hidden{display:none!important}

        /* ============ NOTIFICATION BANNER ============ */
        #tufan-widget-root .liveWinLayer{position:fixed;inset:0;z-index:99990;pointer-events:none;overflow:hidden}
        #tufan-widget-root .lw-card{
            position:absolute;top:64px;left:50%;
            display:flex;align-items:center;gap:6px;
            padding:6px 10px 6px 7px;max-width:88vw;width:auto;
            clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);
            background:
                repeating-linear-gradient(135deg,rgba(192,38,255,.10) 0 6px,transparent 6px 12px),
                linear-gradient(120deg,#12041a 0%,#07030d 55%,#12041a 100%);
            box-shadow:inset 0 0 0 1px rgba(192,38,255,.55),inset 0 0 16px rgba(192,38,255,.14),0 8px 22px rgba(0,0,0,.8);
            opacity:0;
            animation:lwIn .5s cubic-bezier(.18,1.12,.3,1.18) forwards,lwOut .3s ease-in 4.2s forwards;
        }
        @keyframes lwIn{
            0%{transform:translateX(120%);opacity:0;}
            55%{transform:translateX(-52%);opacity:1;}
            78%{transform:translateX(-49%);opacity:1;}
            100%{transform:translateX(-50%);opacity:1;}
        }
        @keyframes lwOut{to{transform:translateX(120%);opacity:0;}}
        #tufan-widget-root .lw-card::after{
            content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;
            background:linear-gradient(90deg,#d24bff,#d9c2f0,#d24bff);
            transform-origin:left center;animation:lwTimer 4.4s linear forwards;opacity:.75;
        }
        @keyframes lwTimer{from{transform:scaleX(1);}to{transform:scaleX(0);}}
        #tufan-widget-root .lw-sig{
            flex:0 0 auto;font-family:'Bungee',sans-serif;font-size:8px;line-height:1;
            color:var(--red-main);border:1px solid var(--red-main);border-radius:2px;
            padding:3px 5px;transform:rotate(-8deg);
            text-shadow:0 0 6px var(--red-glow);
            box-shadow:0 0 6px var(--red-glow),inset 0 0 4px rgba(192,38,255,.2);
            animation:sigFlick 1.6s steps(1,end) infinite;
        }
        @keyframes sigFlick{0%,100%{opacity:1;}52%{opacity:.55;}54%{opacity:1;}78%{opacity:.7;}80%{opacity:1;}}
        #tufan-widget-root .lw-avatar{
            position:relative;flex-shrink:0;width:32px;height:32px;border-radius:50%;
            background:#160a20;border:1.5px solid rgba(212,75,255,.6);
            box-shadow:0 0 10px rgba(192,38,255,.25);
            overflow:hidden;display:grid;place-items:center;
        }
        #tufan-widget-root .lw-avatar::after{
            content:"";position:absolute;inset:-3px;border-radius:50%;
            border:1.5px dashed #c026ff;border-top-color:transparent;border-left-color:transparent;
            animation:sxSpin 2.4s linear infinite;
        }
        @keyframes sxSpin{to{transform:rotate(360deg);}}
        #tufan-widget-root .lw-avatar-fb{font-family:'Chakra Petch',sans-serif;font-weight:900;color:#d9a1ff;font-size:13px;}
        #tufan-widget-root .lw-avatar img{width:100%;height:100%;object-fit:cover;}
        #tufan-widget-root .lw-text{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:0 1 auto;}
        #tufan-widget-root .lw-text *{white-space:nowrap;}
        #tufan-widget-root .lw-label{
            display:inline-flex;align-items:center;gap:5px;
            font-family:'Orbitron',sans-serif;font-size:6.5px;font-weight:900;
            letter-spacing:.2em;color:#d9a1ff;white-space:nowrap;
        }
        #tufan-widget-root .lw-label::before{
            content:"";width:5px;height:5px;border-radius:50%;background:#d24bff;
            box-shadow:0 0 6px rgba(212,75,255,.9);animation:lwDot 1.2s ease-in-out infinite;
        }
        @keyframes lwDot{0%,100%{opacity:.35;}50%{opacity:1;}}
        #tufan-widget-root .lw-name{
            font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;color:#efe4ff;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        #tufan-widget-root .lw-amt{
            display:inline;font-family:'Audiowide',cursive;font-size:12.5px;color:#d24bff;
            text-shadow:0 0 8px rgba(212,75,255,.5);white-space:nowrap;margin-left:7px;
            animation:amtPop .38s cubic-bezier(.2,1.4,.3,1) .28s both;
        }
        @keyframes amtPop{0%{transform:scale(.35);opacity:0;}70%{transform:scale(1.18);}100%{transform:scale(1);opacity:1;}}

        /* ============ FLOATING ICON (ORB) ============ */
        #tufan-widget-root .launcher{
            position:fixed;left:0;top:0;width:58px;height:58px;z-index:9999;
            display:grid;place-items:center;border-radius:50%;cursor:grab;touch-action:none;
            background:
                radial-gradient(circle at 34% 26%,rgba(216,140,255,.28),transparent 60%),
                linear-gradient(155deg,#1b0a2e 0%,#0a0414 55%,#000 100%);
            border:1px solid rgba(212,75,255,.55);
            box-shadow:0 12px 26px rgba(0,0,0,.85),0 6px 12px rgba(0,0,0,.6),0 0 12px var(--red-glow),inset 0 1px 0 rgba(255,255,255,.10);
            animation:mbFloat 4s ease-in-out infinite;
            will-change:transform;
        }
        #tufan-widget-root .launcher:active{cursor:grabbing}
        @keyframes mbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
        #tufan-widget-root .launcher::before{
            content:"";position:absolute;inset:-1px;border-radius:50%;
            border:1px solid rgba(212,75,255,.35);z-index:-1;animation:mbHalo 2.6s ease-in-out infinite;
        }
        @keyframes mbHalo{0%,100%{transform:scale(1);opacity:.4;}50%{transform:scale(1.14);opacity:0;}}
        #tufan-widget-root .launcher-core{
            position:relative;z-index:4;width:72%;height:72%;display:grid;place-items:center;
            overflow:hidden;border-radius:50%;filter:drop-shadow(0 0 6px var(--red-glow));
        }
        #tufan-widget-root .launcher-icon-img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;pointer-events:none}
        #tufan-widget-root .launcher-fallback{font:900 17px 'Chakra Petch',sans-serif;color:#c026ff;text-shadow:0 0 8px var(--red-glow)}
        #tufan-widget-root .launcher-ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none;z-index:2}
        #tufan-widget-root .launcher-ring circle{fill:none;stroke:#c026ff;stroke-width:2;stroke-linecap:round;stroke-dasharray:26 14;transform-origin:50% 50%;animation:sxSpin 6s linear infinite;filter:drop-shadow(0 0 3px rgba(192,38,255,.65))}
        #tufan-widget-root .launcher-ring circle.r2{stroke:rgba(255,255,255,.75);stroke-width:1.2;stroke-dasharray:6 30;animation:sxSpin 4s linear infinite reverse}
        #tufan-widget-root .launcher-orbit{position:absolute;inset:-6px;animation:sxSpin 3.2s linear infinite;pointer-events:none;z-index:2}
        #tufan-widget-root .launcher-orbit i{position:absolute;top:-2px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(212,75,255,.95)}

        /* ============ PANEL — CUT-CORNER ARMOR PLATE ============ */
        #tufan-widget-root .wrap{position:fixed;left:0;top:0;z-index:10000;display:none;opacity:0;pointer-events:none;touch-action:none;scale:.9;transition:opacity .2s ease,scale .25s cubic-bezier(.2,.9,.2,1.1);will-change:transform}
        #tufan-widget-root .wrap.visible{display:flex;opacity:1;pointer-events:auto;scale:1}
        #tufan-widget-root .wrap.dragging{transition:none!important}

        #tufan-widget-root .card-outer{
            position:relative;padding:2px;width:238px;
            clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 20px,100% calc(100% - 20px),calc(100% - 20px) 100%,20px 100%,0 calc(100% - 20px),0 20px);
            background:linear-gradient(150deg,#d24bff 0%,#5b0080 30%,#1a0626 52%,#5b0080 72%,#d24bff 100%);
            animation:outerGlow 3.2s ease-in-out infinite alternate;
            pointer-events:auto !important;
        }
        @keyframes outerGlow{
            from{filter:drop-shadow(0 0 6px rgba(192,38,255,.35)) drop-shadow(0 6px 10px rgba(0,0,0,.72)) drop-shadow(0 18px 28px rgba(0,0,0,.88));}
            to{filter:drop-shadow(0 0 14px rgba(192,38,255,.6)) drop-shadow(0 6px 10px rgba(0,0,0,.72)) drop-shadow(0 18px 28px rgba(0,0,0,.88));}
        }
        #tufan-widget-root .card-outer.shake{animation:shakeHit .55s ease both;}
        @keyframes shakeHit{0%,100%{transform:translate(0,0);}10%{transform:translate(-4px,2px);}20%{transform:translate(4px,-2px);}30%{transform:translate(-3px,-3px);}40%{transform:translate(3px,3px);}50%{transform:translate(-2px,2px);}60%{transform:translate(2px,-2px);}70%{transform:translate(-1px,1px);}80%{transform:translate(1px,-1px);}}

        #tufan-widget-root .bolt{
            position:absolute;width:9px;height:9px;border-radius:50%;z-index:8;pointer-events:none;
            background:radial-gradient(circle at 35% 30%,#f3d9ff,#5b0080 60%,#26003f);
            box-shadow:0 0 4px rgba(192,38,255,.8),inset 0 -1px 2px rgba(0,0,0,.6);
        }
        #tufan-widget-root .bolt::after{
            content:"";position:absolute;left:50%;top:50%;width:72%;height:1.5px;
            background:rgba(0,0,0,.55);transform:translate(-50%,-50%) rotate(45deg);
        }
        #tufan-widget-root .bolt.b1{left:8px;top:8px;} .bolt.b2{right:8px;top:8px;}
        #tufan-widget-root .bolt.b3{left:8px;bottom:8px;} .bolt.b4{right:8px;bottom:8px;}

        #tufan-widget-root .card-stroke{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;overflow:visible;}
        #tufan-widget-root .card-stroke rect{
            x:2px;y:2px;width:calc(100% - 4px);height:calc(100% - 4px);
            fill:none;stroke:rgba(255,255,255,.85);stroke-width:2.2;
            stroke-dasharray:14 86;stroke-linecap:round;
            filter:drop-shadow(0 0 4px rgba(255,255,255,.6)) drop-shadow(0 0 7px rgba(192,38,255,.5));
            animation:strokeRun 3.2s linear infinite;
        }
        #tufan-widget-root .card-stroke rect.s2{stroke:#c026ff;animation-delay:-1.6s;stroke-dasharray:10 90;}
        @keyframes strokeRun{to{stroke-dashoffset:-100;}}

        #tufan-widget-root .card-inner{
            position:relative;overflow:hidden;padding:7px 8px 8px;margin:1px;
            clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
            background:#07030d;
            box-shadow:inset 0 0 18px rgba(192,38,255,.18);
            display:flex;flex-direction:column;
        }

        #tufan-widget-root .crt-overlay{
            position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.5;
            background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
            animation:crtFlicker 7s steps(60) infinite;
        }
        @keyframes crtFlicker{0%,100%{opacity:.5;}8%{opacity:.38;}9%{opacity:.55;}54%{opacity:.42;}55%{opacity:.6;}}
        #tufan-widget-root .laser-sweep{
            position:absolute;left:0;right:0;top:-35%;height:32%;z-index:5;pointer-events:none;
            background:linear-gradient(180deg,transparent,rgba(192,38,255,.14) 60%,rgba(192,38,255,.5) 100%);
            animation:sweepDown 4.2s linear infinite;opacity:.8;
        }
        @keyframes sweepDown{0%{top:-35%;}100%{top:115%;}}

        /* ---------- HEADER ---------- */
        #tufan-widget-root .card-header{
            position:relative;z-index:4;display:flex;flex-direction:column;
            align-items:stretch;justify-content:center;gap:4px;padding:1px 1px 5px;min-width:0;
        }
        #tufan-widget-root .title-bar{
            position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;
            padding:5px 8px;margin:0 -1px;
            clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%);
            background:
                repeating-linear-gradient(135deg,rgba(0,0,0,.30) 0 5px,transparent 5px 10px),
                linear-gradient(180deg,#c026ff 0%,#8a00cc 50%,#5b0080 100%);
            box-shadow:0 4px 10px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.45);
        }
        #tufan-widget-root .tb-live{
            font-family:'Share Tech Mono',monospace;font-size:6.5px;font-weight:700;letter-spacing:.14em;
            color:#fff;display:inline-flex;align-items:center;gap:3px;
            text-shadow:0 1px 2px rgba(0,0,0,.75);flex:0 0 auto;
        }
        #tufan-widget-root .tb-live .dot{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff;animation:dotFlicker 1.4s ease-in-out infinite;}
        @keyframes dotFlicker{0%,100%{opacity:1;}40%{opacity:.25;}60%{opacity:.7;}80%{opacity:.15;}}
        #tufan-widget-root .title-bar .card-title-line1{
            font-family:'Audiowide',cursive;font-size:12px;line-height:1.1;color:#fff;letter-spacing:.02em;
            text-shadow:0 2px 0 rgba(64,0,110,.9),0 0 10px rgba(255,255,255,.35);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;
        }
        #tufan-widget-root .tb-ver{
            font-family:'Orbitron',sans-serif;font-size:6.5px;font-weight:900;letter-spacing:.12em;
            color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.6);
            padding:1px 4px;background:rgba(0,0,0,.28);border-radius:2px;flex:0 0 auto;
        }
        #tufan-widget-root .mode-strip{
            position:relative;display:flex;align-items:center;justify-content:space-between;gap:5px;
            padding:3px 6px;
            border-top:1px solid var(--line);border-bottom:1px solid var(--line);
            background:linear-gradient(180deg,rgba(192,38,255,.07),rgba(0,0,0,.45));
        }
        #tufan-widget-root .mode-badge{
            font-family:'Orbitron',sans-serif;font-size:6.8px;font-weight:900;letter-spacing:.16em;
            color:#fff;background:linear-gradient(180deg,#c026ff,#5b0080);
            padding:2px 6px;transform:skewX(-10deg);
            box-shadow:0 0 8px var(--red-glow);flex:0 0 auto;
        }
        #tufan-widget-root .card-stat{font-family:'Share Tech Mono',monospace;font-size:6.2px;font-weight:700;color:var(--ink-dim);white-space:nowrap;}
        #tufan-widget-root .card-stat .val{color:#c026ff;text-shadow:0 0 5px var(--red-glow);}

        /* ---------- SCREEN ---------- */
        #tufan-widget-root .card-screen{
            position:relative;z-index:3;margin:0 5px;min-height:120px;
            display:flex;align-items:center;justify-content:center;
            border:1px solid rgba(192,38,255,.5);border-radius:4px;
            background:
                radial-gradient(ellipse at 50% 42%,rgba(192,38,255,.15),rgba(70,0,120,.18) 44%,rgba(6,1,10,.97) 100%),
                linear-gradient(rgba(192,38,255,.12) 1px,transparent 1px),
                linear-gradient(90deg,rgba(192,38,255,.10) 1px,transparent 1px);
            background-size:100% 100%,16px 16px,16px 16px;
            background-position:center center;
            box-shadow:0 0 12px rgba(192,38,255,.48),inset 0 0 26px rgba(192,38,255,.16),inset 0 -18px 30px rgba(0,0,0,.85);
            overflow:hidden;
        }
        #tufan-widget-root .card-screen.state-wait{border-color:rgba(192,38,255,.55);}
        #tufan-widget-root .card-screen.state-low{border-color:rgba(255,179,0,.55);box-shadow:0 0 12px rgba(255,179,0,.4),inset 0 0 26px rgba(255,179,0,.1),inset 0 -18px 30px rgba(0,0,0,.85);}
        #tufan-widget-root .card-screen.state-ready{border-color:rgba(0,255,102,.5);box-shadow:0 0 12px rgba(0,255,102,.38),inset 0 0 26px rgba(0,255,102,.09),inset 0 -18px 30px rgba(0,0,0,.85);}
        #tufan-widget-root .card-screen.state-scan{border-color:rgba(0,229,255,.55);box-shadow:0 0 12px rgba(0,229,255,.38),inset 0 0 26px rgba(0,229,255,.09),inset 0 -18px 30px rgba(0,0,0,.85);}
        #tufan-widget-root .card-screen.state-big{border-color:rgba(0,255,102,.6);box-shadow:0 0 14px rgba(0,255,102,.48),inset 0 0 26px rgba(0,255,102,.13),inset 0 -18px 30px rgba(0,0,0,.85);}
        #tufan-widget-root .card-screen.state-small{border-color:rgba(0,213,255,.6);box-shadow:0 0 14px rgba(0,213,255,.48),inset 0 0 26px rgba(0,213,255,.13),inset 0 -18px 30px rgba(0,0,0,.85);}

        #tufan-widget-root .ember-canvas{position:absolute;inset:0;z-index:1;pointer-events:none;}

        /* CORNERS */
        #tufan-widget-root .sc-corner{
            position:absolute;width:13px;height:13px;border-style:solid;z-index:5;pointer-events:none;
            border-color:#c026ff;filter:drop-shadow(0 0 4px rgba(192,38,255,.7));
        }
        #tufan-widget-root .sc-tl{top:-7px;left:-7px;border-width:3px 0 0 3px;}
        #tufan-widget-root .sc-tr{top:-7px;right:-7px;border-width:3px 3px 0 0;}
        #tufan-widget-root .sc-bl{bottom:-7px;left:-7px;border-width:0 0 3px 3px;}
        #tufan-widget-root .sc-br{bottom:-7px;right:-7px;border-width:0 3px 3px 0;}
        #tufan-widget-root .sc-corner.c-amber{border-color:#ffb300;filter:drop-shadow(0 0 4px rgba(255,179,0,.7));}
        #tufan-widget-root .sc-corner.c-green{border-color:#00ff66;filter:drop-shadow(0 0 4px rgba(0,255,102,.7));}
        #tufan-widget-root .sc-corner.c-cyan{border-color:#00e5ff;filter:drop-shadow(0 0 4px rgba(0,229,255,.7));}
        #tufan-widget-root .sc-corner.c-blue{border-color:#00d5ff;filter:drop-shadow(0 0 4px rgba(0,213,255,.7));}

        /* ---------- STATE VIEWS ---------- */
        #tufan-widget-root .sv-wait,#tufan-widget-root .sv-low,#tufan-widget-root .sv-ready,#tufan-widget-root .sv-scan,#tufan-widget-root .sv-result{
            display:none;flex-direction:column;align-items:center;justify-content:center;
            width:100%;position:relative;z-index:4;gap:2px;
            animation:svIn .22s cubic-bezier(.15,.6,.35,1) both;
        }
        @keyframes svIn{from{opacity:0;transform:scale(.94);filter:blur(3px);}to{opacity:1;transform:scale(1);filter:blur(0);}}

        /* EMBLEM */
        #tufan-widget-root .spider-emblem{
            position:relative;width:38px;height:38px;flex:0 0 auto;margin:0 auto 4px;
            display:flex;align-items:center;justify-content:center;overflow:visible;
            border:1.5px solid #c026ff;border-radius:50%;
            box-shadow:0 0 14px var(--red-glow),inset 0 0 12px rgba(0,0,0,.9);
            animation:emblemPulse 1.9s ease-in-out infinite alternate;
        }
        @keyframes emblemPulse{
            from{box-shadow:0 0 9px var(--red-glow),inset 0 0 12px rgba(0,0,0,.9);}
            to{box-shadow:0 0 20px var(--red-glow),inset 0 0 12px rgba(0,0,0,.9);}
        }
        #tufan-widget-root .spider-emblem::before{
            content:"";position:absolute;inset:-6px;border-radius:50%;
            border:1.5px dashed #c026ff;opacity:.75;
            animation:sxSpin 4s linear infinite;
        }
        #tufan-widget-root .spider-emblem img{
            display:block;width:74%;height:74%;max-width:74%;max-height:74%;

    var ectx = emberCanvas ? emberCanvas.getContext('2d') : null;

    function resizeEmberCanvas(){

    function spawnEmber(init){
        if(!emberCanvas) return;
        embers.push({
            x: Math.random() * emberCanvas.width,
            y: init ? Math.random() * emberCanvas.height : emberCanvas.height + 2,
            vx: (Math.random() - .5) * .3,
            vy: -(0.3 + Math.random() * 0.9),
            r: 0.6 + Math.random() * 1.6,
            life: 1,
            fade: 0.008 + Math.random() * 0.02,
            tw: Math.random() * Math.PI * 2
        });
    }
    function drawEmbers(){
        if(!ectx || !emberCanvas || emberCanvas.width === 0) return;
        ectx.clearRect(0, 0, emberCanvas.width, emberCanvas.height);
        for(var i = embers.length - 1; i >= 0; i--){
            var e = embers[i];
            e.x += e.vx; e.y += e.vy; e.life -= e.fade; e.tw += 0.08;
            if(e.life <= 0 || e.y < -4){ embers.splice(i, 1); continue; }
            var a = Math.max(0, Math.min(1, e.life));
            var flick = 0.75 + 0.25 * Math.sin(e.tw * 3);
            ectx.beginPath();
            ectx.fillStyle = '#c026ff';
            ectx.globalAlpha = a * flick;
            ectx.arc(e.x, e.y, e.r, 0, 6.2832);
            ectx.fill();
            ectx.globalAlpha = a * flick * 0.32;
            ectx.beginPath();
            ectx.arc(e.x, e.y, e.r * 2.7, 0, 6.2832);
            ectx.fill();
        }
        ectx.globalAlpha = 1;
        if(Math.random() < 0.45) spawnEmber(false);
    }
    setInterval(drawEmbers, 33);

        return hash.indexOf('wingo') > -1 || href.indexOf('wingo') > -1;

        if (CONFIG.standaloneMode) {
            return { isWinGo: true, isRegister: false, isLogin: false, isRecharge: false };
        }
        var hash = (window.location.hash || '').toLowerCase();
        var href = window.location.href.toLowerCase();
        var isWinGo = detectWinGo();
        var isRegister = hash.indexOf('#/register') > -1;
        var isLogin = hash.indexOf('#/login') > -1;
        var isRecharge = hash.indexOf('#/wallet/recharge') > -1 || hash.indexOf('#/wallet/deposit') > -1 || href.indexOf('recharge') > -1;
        return { isWinGo: isWinGo, isRegister: isRegister, isLogin: isLogin, isRecharge: isRecharge };
    }

    function checkBalance() {
        if (CONFIG.standaloneMode) { window.vsCurrentBalance = 99999; window.vsBalanceFetched = true; return 99999; }
        if (!detectWinGo()) { window.vsCurrentBalance = 0; window.vsBalanceFetched = false; return 0; }
        var selectors = ['[data-v-7b3870ea].Wallet__C-balance-l1 div', '.wallet-balance', '[class*="balance"]', '.money', '.amount'];
        var el = null;
        for (var i = 0; i < selectors.length; i++) {
            try { el = document.querySelector(selectors[i]); if (el && el.textContent.indexOf('₹') > -1) break; } catch (e) {}
        }
        if (!el) {
            var allDivs = document.querySelectorAll('div, span');
            for (var j = 0; j < allDivs.length; j++) {
                var d = allDivs[j], txt = d.textContent || '';
                if (txt.indexOf('₹') > -1 && /[\d,]+\.?\d*/.test(txt) && d.children.length <= 2 && txt.length < 30) { el = d; break; }
            }
        }
        if (el) {
            var match = (el.textContent || '').match(/[₹$]\s*([\d,]+\.?\d*)/);
            if (match) {
                window.vsCurrentBalance = parseFloat(match[1].replace(/,/g, ''));
                window.vsBalanceFetched = true;
                return window.vsCurrentBalance;
            }
        }
        return window.vsBalanceFetched ? window.vsCurrentBalance : 0;
    }

    function updateRouteUI() {
        var r = detectRoute();
        if (r.isRegister || r.isLogin) {
            setMode('register');
            if (!predictionShown && !vsIsAnalyzing) { setVisualState('wait'); }
        } else if (r.isWinGo) {
            var bal = checkBalance();
            if (bal < CONFIG.balanceThreshold) {
                setMode('recharge');
                window.vsCurrentBalance = bal;
                if (!predictionShown && !vsIsAnalyzing) { setVisualState('low'); }
            } else {
                setMode('result');
                if (!predictionShown && !vsIsAnalyzing) { setVisualState('ready'); }
            }
        } else if (r.isRecharge) {
            setMode('recharge');
            if (!predictionShown && !vsIsAnalyzing) { setVisualState('recharge'); }
        } else {
            setMode('recharge');
            if (!predictionShown && !vsIsAnalyzing) { setVisualState('recharge'); }
        }
        setTimeout(autoFitBrandTitle, 30);
    }

    // ACTION BUTTON
    actionBtn.addEventListener('click', function() {
        if (vsIsAnalyzing) return;
        if (currentMode === 'login' || currentMode === 'register') {
            window.location.href = CONFIG.registerLink;
        } else if (currentMode === 'recharge') {
            window.location.href = window.location.origin + CONFIG.rechargePath;
        } else if (currentMode === 'result') {
            runPrediction();
        }
    });

    /* ================================================================
       SCAN SEQUENCE — TARGET LOCK RADAR
       ================================================================ */
    var lockedPeriod = null, lockedPrediction = null;

    function setScanStage(t){
        if(!scanStageTitle) return;
        scanStageTitle.textContent = t;
        scanStageTitle.setAttribute('data-text', t);
        scanStageTitle.classList.remove('hit'); void scanStageTitle.offsetWidth;
        scanStageTitle.classList.add('hit');
        setTimeout(function(){ if(scanStageTitle) scanStageTitle.classList.remove('hit'); }, 340);
    }
    function addMiniLog(cls, text){
        if(!miniLog) return;
        var el = document.createElement('div');
        el.className = 'ml-line ' + cls;
        el.textContent = text;
        miniLog.appendChild(el);
        while(miniLog.children.length > 2) miniLog.removeChild(miniLog.firstChild);
    }
    function spawnBlip(close, final){
        if(!rsBlips) return;
        var bl = document.createElement('span');
        bl.className = 'rs-blip' + (final ? ' final' : '');
        var ang = Math.random() * 6.2832;
        var r = close ? (7 + Math.random() * 9) : (13 + Math.random() * 15);
        var x = 30 + Math.cos(ang) * r;
        var y = 30 + Math.sin(ang) * r;
        bl.style.left = x + 'px';
        bl.style.top = y + 'px';
        rsBlips.appendChild(bl);
        setTimeout(function(){ if(bl.parentNode) bl.parentNode.removeChild(bl); }, 1100);
    }

    function runScanSequence(onDone) {
        setVisualState('scan');
        if(radarScope){ radarScope.classList.remove('locking'); radarScope.classList.remove('locked'); }
        if(rsPct){ rsPct.textContent = '0%'; rsPct.classList.remove('locked'); }
        if(rsBlips) rsBlips.innerHTML = '';
        if(miniLog) miniLog.innerHTML = '';
        if(rsHit){ rsHit.classList.remove('go'); }
        setScanStage('SCANNING SIGNAL');
        if(actionBtn){ actionBtn.textContent = 'SCANNING'; actionBtn.classList.add('scanning'); actionBtn.disabled = true; }

        var STAGES = [
            {at: .08, t: 'SCANNING SIGNAL'},
            {at: .28, t: 'ANALYZING PATTERN'},
            {at: .50, t: 'DECODING SEED'},
            {at: .72, t: 'LOCKING TARGET'},
            {at: .93, t: 'TARGET LOCKED'}
        ];
        var LOGS = [
            {time: 0,    cls: 'info',    text: '[sys] Scanning signal spectrum...'},
            {time: 240,  cls: 'warn',    text: '[warn] Firewall detected — dissolving...'},
            {time: 540,  cls: 'success', text: '[ok] WAF bypassed. MD5 seed extracted.'},
            {time: 880,  cls: 'info',    text: '[sys] Analyzing pattern matrix...'},
            {time: 1180, cls: 'success', text: '[ok] Algorithm decrypted.'},
            {time: 1400, cls: 'info',    text: '[sys] Locking target coordinates...'}
        ];
        var D = 1600;
        var stIdx = 0, lgIdx = 0, blipT = 0;
        var started = Date.now();
        var done = false;

        var iv = setInterval(function(){
            var el = Date.now() - started;
            var pct = Math.min(1, el / D);

            if(rsPct) rsPct.textContent = Math.floor(pct * 100) + '%';
            while(stIdx < STAGES.length && pct >= STAGES[stIdx].at){ setScanStage(STAGES[stIdx].t); stIdx++; }
            while(lgIdx < LOGS.length && el >= LOGS[lgIdx].time){ addMiniLog(LOGS[lgIdx].cls, LOGS[lgIdx].text); lgIdx++; }
            if(el - blipT >= 165 && pct < 1){ blipT = el; spawnBlip(pct > 0.65); }
            if(radarScope && pct >= 0.72 && !radarScope.classList.contains('locking')) radarScope.classList.add('locking');

            if(pct >= 1 && !done){
                done = true; clearInterval(iv);
                spawnBlip(true, true);
                addMiniLog('success', '[ok] SIGNAL LOCKED');
                if(radarScope) radarScope.classList.add('locked');
                if(rsPct){ rsPct.textContent = 'LOCK'; rsPct.classList.add('locked'); }
                if(rsHit){ rsHit.classList.remove('go'); void rsHit.offsetWidth; rsHit.classList.add('go'); }
                setTimeout(onDone, 200);
            }
        }, 40);
    }

    /* ================================================================
       PREDICTION
       ================================================================ */
    async function runPrediction() {
        if (vsIsAnalyzing) return;
        vsIsAnalyzing = true;
        predictionShown = false;
        var startTime = Date.now();
        runScanSequence(function(){});
        try {
            // Fetch REAL recent result from API
            var historyRes = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?ts=' + Date.now());
            var historyData = await historyRes.json();

            var elapsed = Date.now() - startTime;
            if (elapsed < 1850) await new Promise(function(resolve) { setTimeout(resolve, 1850 - elapsed); });

            if (historyData.data && historyData.data.list && historyData.data.list.length > 0) {
                var lastGame = historyData.data.list[0];
                var issue = String(lastGame.issueNumber);
                var last4 = issue.slice(-4);
                var actualNum = parseInt(lastGame.number, 10);
                var result = actualNum >= 5 ? 'BIG' : 'SMALL';

                lockedPeriod = issue;
                lockedPrediction = { s: result, n: String(actualNum) };

                if(resPeriodBottom) resPeriodBottom.textContent = 'PERIOD: ' + last4;
                renderResult(lockedPrediction);
                predictionShown = true;
                setVisualState('result');
                triggerHit();
                setActionLabel('EXECUTE');
                if(actionBtn){ actionBtn.classList.remove('scanning'); actionBtn.disabled = false; }
                vsIsAnalyzing = false;
            } else {
                throw new Error('No result from API');
            }
        } catch (e) {
            console.error('API Error:', e);
            var elapsed2 = Date.now() - startTime;
            if (elapsed2 < 1850) await new Promise(function(resolve) { setTimeout(resolve, 1850 - elapsed2); });
            lockedPrediction = { s: 'FAILED', n: '!' };
            renderResult(lockedPrediction);
            predictionShown = true;
            setVisualState('result');
            triggerHit();
            setActionLabel('RETRY');
            if(actionBtn){ actionBtn.classList.remove('scanning'); actionBtn.disabled = false; }
            vsIsAnalyzing = false;
        }
    }

    function renderResult(pred){
        if(!pred) return;
        var isBig = pred.s === 'BIG';
        if(resBsBadge){
            resBsBadge.textContent = pred.s;
            resBsBadge.setAttribute('data-text', pred.s);
            resBsBadge.className = 'res-bs-badge ' + (isBig ? 'big' : (pred.s === 'SMALL' ? 'small' : ''));
            if(!resBsBadge.querySelector('.bs-goo')){
                var g1 = document.createElement('span'); g1.className = 'bs-goo';
                var g2 = document.createElement('span'); g2.className = 'bs-goo g2';
                resBsBadge.appendChild(g1); resBsBadge.appendChild(g2);
            }
        }
        var numericNum = parseInt(pred.n, 10);
        var allowed = isBig ? (numericNum >= 5 && numericNum <= 9) : (pred.s === 'SMALL' ? (numericNum >= 0 && numericNum <= 4) : false);
        if(ballNum && allowed && NUMBER_IMAGE_MAP[numericNum]){
            ballNum.src = NUMBER_IMAGE_MAP[numericNum];
            ballNum.alt = String(numericNum);
            ballNum.style.display = 'block';
            if(resNumText) resNumText.style.display = 'none';
        } else {
            if(ballNum) ballNum.style.display = 'none';
            if(resNumText){ resNumText.textContent = pred.n; resNumText.style.display = 'grid'; }
        }
    }

    /* ================================================================
       NOTIFICATION BANNER — LIVE WINNING FEED
       ================================================================ */
    (function() {
        var FIRST = ['Gagan','Arjun','Parveen','Deepak','Harish','Rahul','Vikram','Sunil','Rohit','Amit','Sanjay','Neeraj','Manoj','Ravi','Suresh','Aakash','Kunal','Nitin','Ajay','Vivek','Priya','Anjali','Pooja','Kavita','Neha','Sneha','Ritu','Simran','Karan','Yash','Aditya','Varun'];
        var LAST = ['Das','Mishra','Yadav','Rajput','Kumar','Sharma','Verma','Gupta','Singh','Patel','Reddy','Nair','Chauhan','Rana','Bansal','Malhotra','Kapoor','Joshi','Mehta','Agarwal','Pandey'];
        var AVATARS = ['1-Cz2mt-nl.png','2-DzTtSgl1.png','3-CieZaTkx.png','4-FzE5GskB.png','5-BE1kalqa.png','6-BptTdCuy.png','7-OCP1Ruci.png','8-4L9YXhCn.png','9-iOf3oyEz.png','10-BcpE5fen.png','11-DBjki8Hc.png','12-DZNy4n9Y.png'];
        var BASE_URL = 'https://bdgvg.com/assets/png/', currentCard = null;
        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function randAmount() {
            var tiers = [[200, 999, .35], [1000, 4999, .4], [5000, 12000, .2], [12000, 35000, .05]], r = Math.random(), total = 0;
            for (var i = 0; i < tiers.length; i++) { total += tiers[i][2]; if (r <= total) return Math.floor(tiers[i][0] + Math.random() * (tiers[i][1] - tiers[i][0])); }
            return 600;
        }
        function fmt(n){ return n.toLocaleString('en-IN'); }
        function spawn() {
            if (currentCard && currentCard.parentNode) { currentCard.parentNode.removeChild(currentCard); currentCard = null; }
            var name = pick(FIRST) + ' ' + pick(LAST), amount = randAmount(), imageUrl = BASE_URL + pick(AVATARS), initial = name.charAt(0).toUpperCase();
            var card = document.createElement('div');
            card.className = 'lw-card';
            card.style.top = (62 + Math.floor(Math.random() * 20)) + 'px';
            card.innerHTML = '<div class="lw-sig">WIN</div><div class="lw-avatar"><span class="lw-avatar-fb">' + initial + '</span><img src="' + imageUrl + '" onload="this.previousElementSibling.style.display=\'none\'" onerror="this.style.display=\'none\';this.previousElementSibling.style.display=\'grid\'" alt=""></div><div class="lw-text"><span class="lw-label">LIVE WINNING</span><span class="lw-name">' + name + ' <span class="lw-amt">₹' + fmt(amount) + '</span></span></div>';
            liveWinLayer.appendChild(card);
            currentCard = card;
            setTimeout(function() { if (card && card.parentNode) card.parentNode.removeChild(card); if (currentCard === card) currentCard = null; }, 4600);
        }
        setTimeout(spawn, 4000);
        setInterval(spawn, 5500 + Math.floor(Math.random() * 1500));
    })();

    /* Ping */
    setInterval(function() { if(statPing) statPing.textContent = (15 + Math.floor(Math.random() * 8)) + 'MS'; }, 1600);

    // INIT + WATCHERS
    updateRouteUI();
    pollPeriod();
    // Standalone mode: auto-refresh disabled. User must click EXECUTE for new results.
    // setInterval(updateRouteUI, CONFIG.balanceRefreshMs);
    // setInterval(pollPeriod, CONFIG.periodRefreshMs);
    // window.addEventListener('hashchange', function() { setTimeout(updateRouteUI, 100); });
    window.addEventListener('resize', function() {
        resizeEmberCanvas();
        setOrbPos(orbPos.x + 29, orbPos.y + 29);
        setPanelPos(panelPos.x + PANEL_W / 2, panelPos.y + PANEL_H / 2);
        autoFitBrandTitle();
    });
    setTimeout(autoFitBrandTitle, 100);

})();
